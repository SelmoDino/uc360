<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad_ICMBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Emblem Shield -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#grad_ICMBio)" stroke="#93c5fd" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Inner Ring -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Icon Graphic -->
  <g transform="translate(0, -6)">
    <path d="M64 36 L88 46 L88 68 Q64 84 64 84 Q40 68 40 46 Z" fill="none" stroke="#ffffff" stroke-width="3"/>
              <circle cx="64" cy="58" r="6" fill="#93c5fd"/>
  </g>

  <!-- Title / Acronym -->
  <text x="64" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="1.5">
    ICMBio
  </text>

  <!-- Subtitle Agency -->
  <text x="64" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8" fill="#93c5fd" letter-spacing="0.5">
    MMA • BRASIL
